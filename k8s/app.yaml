apiVersion: apps/v1
kind: Deployment
metadata: { name: student-app }
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector: { matchLabels: { app: student-app } }
  template:
    metadata: { labels: { app: student-app } }
    spec:
      containers:
        - name: student-app
          image: IMAGE_PLACEHOLDER
          ports: [{ containerPort: 3000 }]
          env:
            - { name: MONGO_URI, value: "mongodb://mongo:27017/students" }
          readinessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata: { name: student-app }
spec:
  type: NodePort
  selector: { app: student-app }
  ports: [{ port: 80, targetPort: 3000, nodePort: 30080 }]